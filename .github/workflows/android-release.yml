name: Android Release Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # 需要写 Release/上传资产权限

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Decode keystore (from secret KEYSTORE_BASE64)
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "Decoding keystore into keystore.jks"
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
        ls -l keystore.jks

    - name: Create keystore.properties
      if: env.KEYSTORE_BASE64 != ''
      run: |
        cat > keystore.properties <<EOF
        storeFile=keystore.jks
        storePassword=$KEYSTORE_PASSWORD
        keyAlias=$KEY_ALIAS
        keyPassword=$KEY_PASSWORD
        EOF
        echo "keystore.properties created"
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Ensure xposed-api placeholder exists (optional)
      run: |
        mkdir -p app/libs
        if [ ! -f app/libs/xposed-api-82.jar ]; then
          echo "xposed-api-82.jar missing; create placeholder README"
          echo "Place the LSPosed/Xposed API jar here (xposed-api-82.jar)" > app/libs/README.txt
        fi

    - name: Generate Gradle wrapper if missing
      run: |
        if [ ! -f ./gradlew ]; then
          echo "gradlew missing, generating with system gradle..."
          gradle wrapper --gradle-version 8.5
        else
          echo "gradlew already present"
        fi
        chmod +x ./gradlew
        ls -l ./gradlew gradle/wrapper/ || true

    - name: Build signed release APK
      run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      env:
        JAVA_TOOL_OPTIONS: "-Xmx2g"

    - name: Upload artifact (APK)
      uses: actions/upload-artifact@v4
      with:
        name: app-release.apk
        path: app/build/outputs/apk/release/app-release.apk

    - name: Create GitHub Release and upload APK (optional)
      if: github.event_name == 'push'
      uses: ncipollo/release-action@v1
      with:
        tag: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        files: app/build/outputs/apk/release/app-release.apk
        token: ${{ secrets.GITHUB_TOKEN }}
