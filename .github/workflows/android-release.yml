name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          cp keystore.jks app/keystore.jks
          ls -l keystore.jks app/keystore.jks

      - name: Create keystore.properties
        if: env.KEYSTORE_BASE64 != ''
        run: |
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties
          echo "keystore.properties created"

      - name: Ensure xposed-api-82.jar
        run: |
          mkdir -p app/libs
          if [ ! -f app/libs/xposed-api-82.jar ]; then
            echo "缺少 app/libs/xposed-api-82.jar，尝试从 Maven 下载..."
            curl -fL --retry 3 -o app/libs/xposed-api-82.jar \
              https://api.xposed.info/de/robv/android/xposed/api/82/api-82.jar \
            || curl -fL --retry 3 -o app/libs/xposed-api-82.jar \
              https://maven.lsposed.org/de/robv/android/xposed/api/82/api-82.jar \
            || { echo "::error::无法下载 xposed-api-82.jar，请手动放入 app/libs/"; exit 1; }
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release and upload APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          allowUpdates: true
          replacesArtifacts: true
