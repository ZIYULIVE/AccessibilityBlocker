plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
def hasKeystore = false

if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
    def storeFilePath = keystoreProps.getProperty("storeFile") ?: "keystore.jks"
    hasKeystore = rootProject.file(storeFilePath).exists()
    if (!hasKeystore) {
        println "Warning: keystore file '${storeFilePath}' not found. Release will be unsigned."
    }
} else {
    println "Warning: keystore.properties not found. Release will be unsigned."
}

android {
    namespace 'com.ziyu.live'
    compileSdk 34

    defaultConfig {
        applicationId "com.ziyu.live"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {                      // ✅ 修正拼写
        release {
            def storeFilePath = keystoreProps.getProperty("storeFile") ?: "keystore.jks"
            storeFile rootProject.file(storeFilePath)
            storePassword keystoreProps.getProperty("storePassword") ?: 'changeit'
            keyAlias keystoreProps.getProperty("keyAlias") ?: 'ziyu'
            keyPassword keystoreProps.getProperty("keyPassword") ?: 'changeit'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // 删掉 applicationVariants.all { ... generateKeystore ... } 
    
}
